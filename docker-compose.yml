# Local development database. Start it with: docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pagewise
      POSTGRES_PASSWORD: pagewise
      POSTGRES_DB: pagewise
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pagewise -d pagewise']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
