image: node:26-slim

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - validate
  - lint
  - test
  - build
  - deploy

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

before_script:
  - npm install --global pnpm@11.7.0
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile

# ============================================================
# Validate Merge Requests
# ============================================================

validate_merge_target:
  stage: validate
  image: alpine:latest
  before_script: []
  script:
    - |
      echo "Source: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      echo "Target: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "main" ] && \
         [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "dev" ]; then
        echo "ERROR: Only 'dev' is allowed to be merged into 'main'."
        exit 1
      fi

      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "dev" ]; then
        case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" in
          chore/*|feat/*|fix/*|release/*)
            ;;
          *)
            echo "ERROR: Only chore/*, feat/*, fix/* or release/* branches are allowed to be merged into 'dev'."
            exit 1
            ;;
        esac
      fi

      echo "Merge target is valid."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ============================================================
# Lint & Audit
# ============================================================

lint:
  stage: lint
  interruptible: true
  script:
    - |
      pnpm lint || {
        echo "ERROR: Lint check failed. Run 'pnpm lint' locally and fix the reported issues."
        exit 1
      }
audit:
  stage: lint
  interruptible: true
  before_script:
    - npm install --global pnpm@11.7.0
  script:
    - |
      pnpm audit --audit-level=moderate || {
        echo "WARNING: Vulnerabilities with severity moderate or higher found."
        echo "Run 'pnpm audit' locally and try 'pnpm audit --fix'."
        exit 1
      }

# ============================================================
# Test
# ============================================================

test:
  stage: test
  interruptible: true
  services:
    - postgres:17-alpine
  variables:
    POSTGRES_USER: pagewise
    POSTGRES_PASSWORD: pagewise
    POSTGRES_DB: pagewise
    TEST_DATABASE_URL: postgres://pagewise:pagewise@postgres:5432/pagewise_test
  script:
    - pnpm test

# ============================================================
# Staging
# ============================================================

build_docker_staging:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
  before_script: []
  script:
    - docker build --pull -f apps/backend/Dockerfile -t $CI_REGISTRY_IMAGE/backend-staging:latest .
    - echo "$STAGING_HTPASSWD" > htpasswd
    - API_PORT=$(sed -n 's/^BACKEND_PORT=//p' "$STAGING_ENV_FILE" | tr -d '\r')
    - docker build --pull -f apps/frontend/Dockerfile --build-arg API_PORT=$API_PORT --build-arg NGINX_CONF=nginx.staging.conf -t $CI_REGISTRY_IMAGE/frontend-staging:latest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/backend-staging:latest
    - docker push $CI_REGISTRY_IMAGE/frontend-staging:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_staging:
  stage: deploy
  image: docker:24
  tags:
    - nas-runner
  before_script: []
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker compose -p pagewise-staging --env-file "$STAGING_ENV_FILE" -f docker-compose.deploy.yml pull
    - docker compose -p pagewise-staging --env-file "$STAGING_ENV_FILE" -f docker-compose.deploy.yml up -d --no-build --wait
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================================
# Production
# ============================================================

build_docker_production:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
  before_script: []
  script:
    - docker build --pull -f apps/backend/Dockerfile -t $CI_REGISTRY_IMAGE/backend-production:latest .
    - API_PORT=$(sed -n 's/^BACKEND_PORT=//p' "$PRODUCTION_ENV_FILE" | tr -d '\r')
    - docker build --pull -f apps/frontend/Dockerfile --build-arg API_PORT=$API_PORT -t $CI_REGISTRY_IMAGE/frontend-production:latest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/backend-production:latest
    - docker push $CI_REGISTRY_IMAGE/frontend-production:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_production:
  stage: deploy
  image: docker:24
  tags:
    - nas-runner
  before_script: []
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker compose -p pagewise-production --env-file "$PRODUCTION_ENV_FILE" -f docker-compose.deploy.yml pull
    - docker compose -p pagewise-production --env-file "$PRODUCTION_ENV_FILE" -f docker-compose.deploy.yml up -d --no-build --wait
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
